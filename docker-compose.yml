services:
  mariadb:
    image: mariadb:11.4
    container_name: raccounting-mariadb
    restart: unless-stopped
    environment:
      # Root stays passwordless for convenience — this is for local development only.
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
